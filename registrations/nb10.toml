statistic = "delta-method HAC ΔSR VMP(EW) − EW, full window from 2010-02-02; Romano–Wolf over 8"
rule_text = 'RW p < 0.05 rejects (narrowly < 0.10); test-window ΔSR same sign'
evaluated = true

