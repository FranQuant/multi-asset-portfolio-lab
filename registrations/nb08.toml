## §1 PRE-REGISTRATION

Registered **before** any cell below computes a Phase 2 statistic. The lag rule, block length and bootstrap size were fixed by read-only design checks that printed no tested statistic on real data.

**Runs.** Core: EW, GMV(S), MaxSharpe(S), BMV(0.3), BL(0.1), MDP(S), ERC(S), HRP(S), one registered configuration per Phase 1 notebook (252-day sample Σ). References, used in the Sharpe intervals only: IV, IVP. α family: all 23 strategies backtested in Phase 1 (core plus every sensitivity run). Reproduction gate: Sharpe to 2 dp for all 23 runs in all three windows, and the printed Phase 1 OLS CAPM α t-statistics.

**Data.** Daily net returns in excess of BIL. Windows: full (from the first scored rebalance), train (≤ 2022-12-31), test (2023+).

**Methods.**

- Newey–West long-run variance, Bartlett kernel, lag $L = \lfloor 4(T/100)^{2/9} \rfloor$ per window (9 / 8 / 6).
- Sharpe difference: delta-method test on $(\mu_a, \mu_b, E[x_a^2], E[x_b^2])$ with the Newey–West covariance; two-sided normal p.
- Bootstrap: stationary, mean block 21 days, B = 10,000, seed 20260923; one index draw is shared by every series in a window.
- CAPM α: the Phase 1 regression on the market excess return, with Newey–West standard errors (no degrees-of-freedom correction).

**H1 (Sharpe vs EW, 7 tests).** For each core method $m \neq$ EW: $H_0$: $SR_m = SR_{EW}$ on the full window. Holm adjustment over the 7 raw p-values. NULL REJECTED iff adjusted p < 0.05 AND the test-window ΔSR has the full-window sign (otherwise NULL REJECTED, NOT ROBUST). An adjusted p in [0.05, 0.10) holds narrowly.

**H1-all (descriptive).** All 28 core pairs with the same test, Benjamini–Hochberg at q = 0.10.

**H2 (CAPM α, 23 tests).** For each strategy in the α family: $H_0$: α = 0 on the full window, $t = \hat\alpha / \mathrm{se}_{NW}$. Romano–Wolf step-down adjusted p from centred bootstrap statistics $t^* = (\alpha^* - \hat\alpha)/\mathrm{se}_{NW}$ on the shared indices. Verdict bands and the test-window sign condition as in H1. The members with Phase 1 OLS t ≥ 1.9 are labelled &#91;cluster&#93; in advance: MaxSharpe (S, LW, OAS), MDP (S, LW), HRP (S, LW, positional, ward). Holm and BH adjusted p and the unadjusted Newey–West t are descriptive.

**Descriptive.** Performance table; bootstrap 95% percentile Sharpe intervals for the 10 core and reference runs in each window; the bootstrap p of each H1 difference as a cross-check; wealth and drawdown.

**Honest limitations.**

- The tests are asymptotic. In the design check the Sharpe-difference interval covered 0.948 with finite fourth moments and 0.93 with infinite kurtosis.
- Power is low. In that check (correlation 0.8, 17 years) the ΔSR standard error was about 0.16, so an unadjusted rejection needs roughly 0.30 of annual Sharpe; Holm raises the bar. A NULL HOLDS verdict is not evidence of equal Sharpe ratios.
- The α family is the Phase 1 search set. Designs rejected before any backtest (notebooks 02 and 03) are not in it, so the adjustment is a lower bound on the true multiplicity.
- The &#91;cluster&#93; label was set from Phase 1 OLS t-statistics that had already been seen; it names the members, it does not change their test.
- The test window is 3.3 years; its sign condition is a consistency check, not a test.'''

