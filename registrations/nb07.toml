[[hypothesis]]
id = "H7"
label = 'H7 (forecast bias, q_HRP-q_GMV < 0)'
kind = "directional_t"
statistic = "mean(q_HRP - q_GMV), q = log(realized segment vol / ex-ante vol): full-window t, test-window mean"
