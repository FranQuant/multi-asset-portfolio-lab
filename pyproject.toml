[project]
name = "maplab"
version = "0.1.0"
description = "Multi-asset portfolio construction: a fair comparison of deterministic allocation families on one locked harness."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyarrow>=12.0",
]

[tool.setuptools.packages.find]
where = ["src"]
