[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maplab"
version = "0.1.0"
description = "Multi-asset portfolio construction: a fair comparison of deterministic allocation families on one locked harness."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["ipython", "jupyter"]
# reference tests only; PyPortfolioOpt 1.6.0 needs a scipy shim on scipy >= 1.18, provided in tests/test_reference.py
ref = ["pyportfolioopt==1.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["repro: re-runs real-data backtests against registrations/reproduction.toml (needs data/cache)"]
